<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little Shop</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================================
         TITLE SCREEN
    ========================================== -->

    <div id="titleScreen" class="screen">

        <!-- Sky decorations -->

        <div class="sun"></div>

        <div class="cloud cloud-one">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="cloud cloud-two">
            <div></div>
            <div></div>
            <div></div>
        </div>


        <!-- Background hills -->

        <div class="hill hill-back"></div>
        <div class="hill hill-front"></div>


        <!-- Main title -->

        <div class="title-content">

            <h1>
                MY LITTLE SHOP
            </h1>

            <p>
                A TINY SHOP. A BIG DREAM.
            </p>


            <div class="menu">

                <button id="playButton">
                    ▶ PLAY
                </button>

                <button id="customizeButton">
                    🧍 CUSTOMIZE
                </button>

                <button id="settingsButton">
                    ⚙ SETTINGS
                </button>

            </div>

        </div>


        <div class="version">
            v0.1.0
        </div>

    </div>



    <!-- =========================================
         GAME SCREEN
    ========================================== -->

    <div id="gameScreen" class="screen hidden">

        <div class="placeholder">

            <h2>
                YOUR SHOP
            </h2>

            <p>
                The shop will be built here.
            </p>

            <button id="backButton">
                ← BACK
            </button>

        </div>

    </div>



    <!-- =========================================
         CUSTOMIZATION SCREEN
    ========================================== -->

    <div id="customizeScreen" class="screen hidden">

        <div class="placeholder">

            <h2>
                CREATE YOUR SHOPKEEPER
            </h2>

            <p>
                Character customization is coming soon!
            </p>

            <button id="customizeBackButton">
                ← BACK
            </button>

        </div>

    </div>



    <!-- =========================================
         SETTINGS SCREEN
    ========================================== -->

    <div id="settingsScreen" class="screen hidden">

        <div class="placeholder">

            <h2>
                SETTINGS
            </h2>

            <p>
                Settings are coming soon!
            </p>

            <button id="settingsBackButton">
                ← BACK
            </button>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
