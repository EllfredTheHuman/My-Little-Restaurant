<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Little Shop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         TITLE SCREEN
    ========================================== -->

    <div
        id="titleScreen"
        class="screen"
    >


        <!-- =====================================
             SKY
        ====================================== -->

        <div class="sun"></div>


        <div class="cloud cloud-one">

            <div></div>
            <div></div>
            <div></div>

        </div>


        <div class="cloud cloud-two">

            <div></div>
            <div></div>
            <div></div>

        </div>


        <!-- =====================================
             BACKGROUND HILLS
        ====================================== -->

        <div
            class="hill hill-back"
        ></div>

        <div
            class="hill hill-front"
        ></div>


        <!-- =====================================
             TITLE
        ====================================== -->

        <div class="title-content">


            <h1>
                MY LITTLE SHOP
            </h1>


            <p>
                A TINY SHOP. A BIG DREAM.
            </p>


            <!-- =================================
                 MENU
            ================================== -->

            <div class="menu">


                <button
                    id="playButton"
                >
                    ▶ PLAY
                </button>


                <button
                    id="customizeButton"
                >
                    🧍 CUSTOMIZE
                </button>


                <button
                    id="settingsButton"
                >
                    ⚙ SETTINGS
                </button>


            </div>


        </div>


        <!-- =====================================
             VERSION
        ====================================== -->

        <div class="version">
            v0.1.0
        </div>


    </div>



    <!-- =========================================
         GAME SCREEN
    ========================================== -->

    <div
        id="gameScreen"
        class="screen hidden"
    >

        <div class="placeholder">


            <h2>
                YOUR SHOP
            </h2>


            <p>
                The shop will be built here.
            </p>


            <button
                id="backButton"
            >
                ← BACK
            </button>


        </div>

    </div>



    <!-- =========================================
         SETTINGS SCREEN
    ========================================== -->

    <div
        id="settingsScreen"
        class="screen hidden"
    >

        <div class="placeholder">


            <h2>
                SETTINGS
            </h2>


            <p>
                Settings are coming soon!
            </p>


            <button
                id="settingsBackButton"
            >
                ← BACK
            </button>


        </div>

    </div>



    <!-- =========================================
         MAIN SCRIPT
    ========================================== -->

    <script src="script.js"></script>


</body>

</html>
