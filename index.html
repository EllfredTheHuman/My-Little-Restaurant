<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little Shop</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- TITLE SCREEN -->

    <div id="titleScreen" class="screen">

        <div class="background-shop">

            <div class="shop-sign">
                MY LITTLE SHOP
            </div>

            <div class="shop-window">

                <div class="window-light"></div>

                <div class="window-shelf">
                    🍎 🍞 🥛 🍪
                </div>

            </div>

            <div class="shop-door">
                🚪
            </div>

        </div>


        <div class="title-content">

            <h1>
                MY LITTLE SHOP
            </h1>

            <p>
                A TINY SHOP. A BIG DREAM.
            </p>


            <div class="menu">

                <button id="playButton">
                    ▶ PLAY
                </button>

                <button id="customizeButton">
                    🧍 CUSTOMIZE
                </button>

                <button id="settingsButton">
                    ⚙ SETTINGS
                </button>

            </div>

        </div>


        <div class="version">
            v0.1.0
        </div>

    </div>



    <!-- GAME SCREEN -->

    <div id="gameScreen" class="screen hidden">

        <h2>
            YOUR SHOP
        </h2>

        <p>
            The shop will be built here!
        </p>

        <button id="backButton">
            ← BACK
        </button>

    </div>



    <!-- CUSTOMIZATION SCREEN -->

    <div id="customizeScreen" class="screen hidden">

        <h2>
            CREATE YOUR SHOPKEEPER
        </h2>

        <p>
            Character customization coming soon!
        </p>

        <button id="customizeBackButton">
            ← BACK
        </button>

    </div>



    <!-- SETTINGS SCREEN -->

    <div id="settingsScreen" class="screen hidden">

        <h2>
            SETTINGS
        </h2>

        <p>
            Settings coming soon!
        </p>

        <button id="settingsBackButton">
            ← BACK
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
