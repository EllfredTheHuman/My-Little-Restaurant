<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Character Creator - My Little Shop</title>

    <link rel="stylesheet" href="character.css">

</head>


<body>

    <main class="character-editor">


        <!-- HEADER -->

        <header class="editor-header">

            <h1>CREATE YOUR SHOPKEEPER</h1>

            <p>Make your little character!</p>

        </header>


        <!-- CHARACTER PREVIEW -->

        <section class="character-preview">

            <div class="preview-box">

                <div id="character" class="character">

                    <!-- HAIR -->

                    <div class="hair">

                        <div class="hair-top"></div>

                        <div class="hair-left"></div>

                        <div class="hair-right"></div>

                    </div>


                    <!-- HEAD -->

                    <div class="head">

                        <div class="eye left-eye"></div>

                        <div class="eye right-eye"></div>

                        <div class="mouth"></div>

                    </div>


                    <!-- BODY -->

                    <div class="body">

                        <div class="shirt"></div>

                    </div>


                    <!-- ARMS -->

                    <div class="arm left-arm"></div>

                    <div class="arm right-arm"></div>


                    <!-- LEGS -->

                    <div class="leg left-leg"></div>

                    <div class="leg right-leg"></div>


                    <!-- SHOES -->

                    <div class="shoe left-shoe"></div>

                    <div class="shoe right-shoe"></div>


                    <!-- ACCESSORY -->

                    <div
                        id="accessory"
                        class="accessory"
                    ></div>

                </div>

            </div>

        </section>


        <!-- CUSTOMIZATION -->

        <section class="customization-panel">


            <!-- HAIR -->

            <div class="customization-row">

                <h2>HAIR</h2>

                <button
                    id="hairPrevious"
                    class="arrow-button"
                >
                    ◀
                </button>

                <div
                    id="hairSelection"
                    class="selection"
                >
                    Brown
                </div>

                <button
                    id="hairNext"
                    class="arrow-button"
                >
                    ▶
                </button>

            </div>


            <!-- SHIRT -->

            <div class="customization-row">

                <h2>SHIRT</h2>

                <button
                    id="shirtPrevious"
                    class="arrow-button"
                >
                    ◀
                </button>

                <div
                    id="shirtSelection"
                    class="selection"
                >
                    Blue
                </div>

                <button
                    id="shirtNext"
                    class="arrow-button"
                >
                    ▶
                </button>

            </div>


            <!-- PANTS -->

            <div class="customization-row">

                <h2>PANTS</h2>

                <button
                    id="pantsPrevious"
                    class="arrow-button"
                >
                    ◀
                </button>

                <div
                    id="pantsSelection"
                    class="selection"
                >
                    Black
                </div>

                <button
                    id="pantsNext"
                    class="arrow-button"
                >
                    ▶
                </button>

            </div>


            <!-- SHOES -->

            <div class="customization-row">

                <h2>SHOES</h2>

                <button
                    id="shoesPrevious"
                    class="arrow-button"
                >
                    ◀
                </button>

                <div
                    id="shoesSelection"
                    class="selection"
                >
                    Brown
                </div>

                <button
                    id="shoesNext"
                    class="arrow-button"
                >
                    ▶
                </button>

            </div>


            <!-- ACCESSORY -->

            <div class="customization-row">

                <h2>ACCESSORY</h2>

                <button
                    id="accessoryPrevious"
                    class="arrow-button"
                >
                    ◀
                </button>

                <div
                    id="accessorySelection"
                    class="selection"
                >
                    None
                </div>

                <button
                    id="accessoryNext"
                    class="arrow-button"
                >
                    ▶
                </button>

            </div>


        </section>


        <!-- ACTIONS -->

        <div class="editor-actions">

            <button
                id="randomizeButton"
                class="secondary-button"
            >
                RANDOMIZE
            </button>

            <button
                id="continueButton"
                class="primary-button"
            >
                CONTINUE ▶
            </button>

        </div>


        <!-- BACK -->

        <button
            id="backButton"
            class="back-button"
        >
            ◀ BACK
        </button>


    </main>


    <script src="character.js"></script>

</body>

</html>
