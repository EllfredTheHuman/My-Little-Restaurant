<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Character Creator - My Little Shop</title>

    <link rel="stylesheet" href="character.css">
</head>

<body>

    <div class="creator">

        <!-- HEADER -->

        <header class="creator-header">

            <h1>CREATE YOUR SHOPKEEPER</h1>

            <p>Make your little character!</p>

        </header>


        <!-- CHARACTER PREVIEW -->

        <section class="preview-area">

            <div class="preview-background">

                <div class="ground"></div>

                <div class="character">

                    <!-- HAIR BACK -->

                    <div class="hair-back"></div>

                    <!-- BODY -->

                    <div class="body">

                        <div class="shirt-detail"></div>

                    </div>

                    <!-- HEAD -->

                    <div class="head">

                        <div class="face">

                            <div class="eye eye-left"></div>
                            <div class="eye eye-right"></div>

                            <div class="mouth"></div>

                        </div>

                    </div>

                    <!-- HAIR FRONT -->

                    <div class="hair-front"></div>

                    <!-- ARMS -->

                    <div class="arm arm-left"></div>
                    <div class="arm arm-right"></div>

                    <!-- LEGS -->

                    <div class="leg leg-left"></div>
                    <div class="leg leg-right"></div>

                    <!-- SHOES -->

                    <div class="shoe shoe-left"></div>
                    <div class="shoe shoe-right"></div>

                    <!-- ACCESSORY -->

                    <div id="accessory"></div>

                </div>

            </div>

        </section>


        <!-- CUSTOMIZATION -->

        <section class="customization">

            <div class="custom-row">

                <span>HAIR</span>

                <button id="hairPrevious">◀</button>

                <div id="hairName">Brown</div>

                <button id="hairNext">▶</button>

            </div>


            <div class="custom-row">

                <span>SHIRT</span>

                <button id="shirtPrevious">◀</button>

                <div id="shirtName">Blue</div>

                <button id="shirtNext">▶</button>

            </div>


            <div class="custom-row">

                <span>PANTS</span>

                <button id="pantsPrevious">◀</button>

                <div id="pantsName">Blue</div>

                <button id="pantsNext">▶</button>

            </div>


            <div class="custom-row">

                <span>SHOES</span>

                <button id="shoesPrevious">◀</button>

                <div id="shoesName">Brown</div>

                <button id="shoesNext">▶</button>

            </div>


            <div class="custom-row">

                <span>ACCESSORY</span>

                <button id="accessoryPrevious">◀</button>

                <div id="accessoryName">None</div>

                <button id="accessoryNext">▶</button>

            </div>

        </section>


        <!-- BUTTONS -->

        <div class="buttons">

            <button id="randomizeButton" class="random-button">
                🎲 RANDOMIZE
            </button>

            <button id="continueButton" class="continue-button">
                CONTINUE ▶
            </button>

        </div>


        <button id="backButton" class="back-button">
            ◀ BACK
        </button>

    </div>


    <script src="character.js"></script>

</body>

</html>
