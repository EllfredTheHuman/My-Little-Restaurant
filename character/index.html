<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Character Creator - My Little Shop</title>

    <link rel="stylesheet" href="character.css">

</head>


<body>


    <main class="character-editor">


        <header class="editor-header">

            <h1>
                CREATE YOUR SHOPKEEPER
            </h1>

            <p>
                Make your little character!
            </p>

        </header>



        <section class="character-preview">

            <div class="preview-box">


                <div
                    id="character"
                    class="character"
                >


                    <div class="character-head">

                        <div class="character-hair"></div>


                        <div class="character-eyes">

                            <span></span>
                            <span></span>

                        </div>


                        <div class="character-mouth"></div>

                    </div>



                    <div class="character-body">

                        <div class="character-shirt"></div>

                    </div>



                    <div class="character-legs">

                        <div class="character-leg left"></div>

                        <div class="character-leg right"></div>

                    </div>



                    <div class="character-shoes">

                        <div class="character-shoe left"></div>

                        <div class="character-shoe right"></div>

                    </div>


                </div>

            </div>

        </section>



        <section class="customization-panel">


            <div class="customization-row">

                <h2>HAIR</h2>

                <button
                    class="arrow-button"
                    id="hairPrevious"
                >
                    ◀
                </button>

                <div
                    class="selection"
                    id="hairSelection"
                >
                    Brown
                </div>

                <button
                    class="arrow-button"
                    id="hairNext"
                >
                    ▶
                </button>

            </div>



            <div class="customization-row">

                <h2>SHIRT</h2>

                <button
                    class="arrow-button"
                    id="shirtPrevious"
                >
                    ◀
                </button>

                <div
                    class="selection"
                    id="shirtSelection"
                >
                    Blue
                </div>

                <button
                    class="arrow-button"
                    id="shirtNext"
                >
                    ▶
                </button>

            </div>



            <div class="customization-row">

                <h2>PANTS</h2>

                <button
                    class="arrow-button"
                    id="pantsPrevious"
                >
                    ◀
                </button>

                <div
                    class="selection"
                    id="pantsSelection"
                >
                    Black
                </div>

                <button
                    class="arrow-button"
                    id="pantsNext"
                >
                    ▶
                </button>

            </div>



            <div class="customization-row">

                <h2>SHOES</h2>

                <button
                    class="arrow-button"
                    id="shoesPrevious"
                >
                    ◀
                </button>

                <div
                    class="selection"
                    id="shoesSelection"
                >
                    Brown
                </div>

                <button
                    class="arrow-button"
                    id="shoesNext"
                >
                    ▶
                </button>

            </div>



            <div class="customization-row">

                <h2>ACCESSORY</h2>

                <button
                    class="arrow-button"
                    id="accessoryPrevious"
                >
                    ◀
                </button>

                <div
                    class="selection"
                    id="accessorySelection"
                >
                    None
                </div>

                <button
                    class="arrow-button"
                    id="accessoryNext"
                >
                    ▶
                </button>

            </div>


        </section>



        <div class="editor-actions">

            <button
                id="randomizeButton"
                class="secondary-button"
            >
                RANDOMIZE
            </button>


            <button
                id="continueButton"
                class="primary-button"
            >
                CONTINUE ▶
            </button>

        </div>



        <button
            id="backButton"
            class="back-button"
        >
            ◀ BACK
        </button>


    </main>


    <script src="character.js"></script>

</body>

</html>
