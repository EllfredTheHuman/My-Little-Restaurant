<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Little Restaurant</title>

    <link
        rel="stylesheet"
        href="game.css"
    >

</head>


<body>


<div id="game">


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <header class="game-header">

        <div class="game-logo">
            MY LITTLE RESTAURANT
        </div>

        <div
            id="money"
            class="money"
        >
            $100
        </div>

    </header>


    <!-- =====================================
         RESTAURANT
    ====================================== -->

    <main id="restaurant">


        <div class="wall"></div>

        <div class="floor"></div>


        <!-- =================================
             SIGN
        ================================== -->

        <div class="restaurant-sign">
            MY LITTLE RESTAURANT
        </div>


        <!-- =================================
             KITCHEN DOOR
        ================================== -->

        <div
            id="kitchenDoor"
            class="door-area kitchen-door"
        >

            <div class="door">

                <div class="door-window"></div>

                <div class="door-handle"></div>

            </div>

            <div class="door-label">
                E — KITCHEN
            </div>

        </div>


        <!-- =================================
             OFFICE DOOR
        ================================== -->

        <div
            id="officeDoor"
            class="door-area office-door"
        >

            <div class="door">

                <div class="door-window"></div>

                <div class="door-handle"></div>

            </div>

            <div class="door-label">
                E — OFFICE
            </div>

        </div>


        <!-- =================================
             FRONT DOOR
        ================================== -->

        <div
            id="frontDoor"
            class="door-area front-door"
        >

            <div class="door">

                <div class="door-window"></div>

                <div class="door-handle"></div>

            </div>

            <div class="door-label">
                E — EXIT
            </div>

        </div>


        <!-- =================================
             TABLE
        ================================== -->

        <div class="table table-one">

            <div class="table-top"></div>

            <div class="table-leg"></div>

            <div class="chair chair-left"></div>

            <div class="chair chair-right"></div>

        </div>


        <!-- =================================
             PLAYER
        ================================== -->

        <div id="player">

            <canvas
                id="playerCanvas"
                width="32"
                height="48"
            ></canvas>

        </div>


    </main>


    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls">

        WASD / ARROW KEYS — MOVE

    </div>


    <script src="game.js"></script>


</div>

</body>

</html>
