<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Little Restaurant</title>

    <link
        rel="stylesheet"
        href="game.css"
    >

</head>


<body>


<!-- =========================================
     GAME
========================================= -->

<div id="game">


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <header class="game-header">

        <div class="game-logo">
            🍔 MY LITTLE RESTAURANT
        </div>

        <div class="money">
            💰 $100
        </div>

    </header>


    <!-- =====================================
         RESTAURANT
    ====================================== -->

    <main id="restaurant">


        <!-- WALL -->

        <div class="wall"></div>


        <!-- FLOOR -->

        <div class="floor"></div>


        <!-- RESTAURANT SIGN -->

        <div class="restaurant-sign">
            MY LITTLE RESTAURANT
        </div>


        <!-- =================================
             ENTRANCE
        ================================== -->

        <div class="entrance">

            <div class="door">
                🚪
            </div>

        </div>


        <!-- =================================
             COUNTER
        ================================== -->

        <div class="counter">

            <div class="counter-top"></div>

            <div class="counter-front">
                🍔 KITCHEN
            </div>

        </div>


        <!-- =================================
             TABLE 1
        ================================== -->

        <div class="table table-one">

            <div class="table-top"></div>

            <div class="chair chair-one"></div>

            <div class="chair chair-two"></div>

        </div>


        <!-- =================================
             TABLE 2
        ================================== -->

        <div class="table table-two">

            <div class="table-top"></div>

            <div class="chair chair-one"></div>

            <div class="chair chair-two"></div>

        </div>


        <!-- =================================
             PLAYER
        ================================== -->

        <div id="player">

            <canvas
                id="playerCanvas"
                width="32"
                height="48"
            ></canvas>

        </div>


    </main>


    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls">

        WASD / ARROW KEYS — MOVE

    </div>


    <!-- =====================================
         GAME JAVASCRIPT
    ====================================== -->

    <script src="game.js"></script>


</div>

</body>

</html>
