<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Little Restaurant</title>

    <link
        rel="stylesheet"
        href="game.css"
    >

</head>


<body>


<div id="game">


    <!-- =====================================
         TOP BAR
    ====================================== -->

    <header class="game-header">

        <div class="game-logo">
            🍔 MY LITTLE RESTAURANT
        </div>

        <div
            id="money"
            class="money"
        >
            💰 $100
        </div>

    </header>


    <!-- =====================================
         RESTAURANT
    ====================================== -->

    <main id="restaurant">


        <!-- WALL -->

        <div class="wall"></div>


        <!-- FLOOR -->

        <div class="floor"></div>


        <!-- RESTAURANT SIGN -->

        <div class="restaurant-sign">
            MY LITTLE RESTAURANT
        </div>


        <!-- =================================
             FRONT DOOR
        ================================== -->

        <div
            id="frontDoor"
            class="door-area front-door"
        >

            <div class="door">

                🚪

            </div>

            <div class="door-label">

                E — EXIT

            </div>

        </div>


        <!-- =================================
             KITCHEN DOOR
        ================================== -->

        <div
            id="kitchenDoor"
            class="door-area kitchen-door"
        >

            <div class="door">

                🍳

            </div>

            <div class="door-label">

                E — KITCHEN

            </div>

        </div>


        <!-- =================================
             OFFICE DOOR
        ================================== -->

        <div
            id="officeDoor"
            class="door-area office-door"
        >

            <div class="door">

                🧑‍💼

            </div>

            <div class="door-label">

                E — OFFICE

            </div>

        </div>


        <!-- =================================
             ONE STARTING TABLE
        ================================== -->

        <div class="table table-one">

            <div class="table-top"></div>

            <div class="chair chair-left"></div>

            <div class="chair chair-right"></div>

        </div>


        <!-- =================================
             PLAYER
        ================================== -->

        <div id="player">

            <canvas
                id="playerCanvas"
                width="32"
                height="48"
            ></canvas>

        </div>


    </main>


    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls">

        WASD / ARROW KEYS — MOVE

    </div>


    <script src="game.js"></script>


</div>

</body>

</html>
